
name: Boji iOS Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Find Xcode projects
        run: |
          find ios -maxdepth 3 \( -name "*.xcodeproj" -o -name "*.xcworkspace" \)

      - name: Show available schemes
        run: |
          xcodebuild -list -project ios/Boji.xcodeproj

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project ios/Boji.xcodeproj \
            -scheme Boji \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
